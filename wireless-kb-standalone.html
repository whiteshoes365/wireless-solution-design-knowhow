  <style>
/* ============ 무선모듈 HW 지식 베이스 — 스타일 ============ */
:root {
  --bg: #0f1419;
  --bg-elev: #161c24;
  --bg-side: #131820;
  --card: #1b232e;
  --border: #28303c;
  --text: #e6edf3;
  --text-dim: #9aa7b4;
  --text-faint: #6b7785;
  --accent: #4aa3ff;
  --accent-soft: #1d3a5c;
  --code-bg: #0c1117;
  --tip: #2ea043; --tip-bg: #11271a;
  --warn: #e3b341; --warn-bg: #2b2410;
  --why: #a371f7; --why-bg: #221833;
  --info: #4aa3ff; --info-bg: #112436;
  --shadow: 0 4px 16px rgba(0,0,0,.35);
  --radius: 12px;
  --sidebar-w: 300px;
}
[data-theme="light"] {
  --bg: #f5f7fa; --bg-elev: #ffffff; --bg-side: #eef2f7; --card: #ffffff;
  --border: #dce3ec; --text: #1a2330; --text-dim: #56657a; --text-faint: #8a99ab;
  --accent: #0969da; --accent-soft: #ddeaff; --code-bg: #f0f3f7;
  --tip-bg: #e6f6ec; --warn-bg: #fbf3da; --why-bg: #f0e8ff; --info-bg: #e4f0fb;
  --shadow: 0 4px 16px rgba(20,40,70,.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.7; font-size: 15.5px;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Layout ---------- */
.layout { display: flex; min-height: 100vh; }

/* ---------- Topbar (mobile) ---------- */
.topbar {
  display: none; position: sticky; top: 0; z-index: 50;
  align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--bg-elev); border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 15px; font-weight: 700; }
.icon-btn {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  width: 38px; height: 38px; border-radius: 9px; cursor: pointer;
  font-size: 17px; display: grid; place-items: center; flex: 0 0 auto;
}
.icon-btn:hover { border-color: var(--accent); }

/* ---------- Sidebar ---------- */
.sidebar {
  width: var(--sidebar-w); flex: 0 0 var(--sidebar-w);
  background: var(--bg-side); border-right: 1px solid var(--border);
  height: 100vh; position: sticky; top: 0; overflow-y: auto;
  padding: 20px 14px 40px;
}
.brand { padding: 4px 8px 16px; }
.brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.3px; }
.brand p { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.brand .ver { font-size: 11px; color: var(--text-faint); margin-top: 6px; }

.tabbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 4px 14px; }
.tab-btn { display: flex; align-items: center; gap: 6px; flex: 1 1 auto;
  background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 9px; padding: 8px 10px; cursor: pointer; font-size: 13px; font-weight: 600;
  justify-content: center; white-space: nowrap; }
.tab-btn:hover { color: var(--text); border-color: var(--accent); }
.tab-btn.active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }

.search-box { position: relative; margin: 6px 4px 16px; }
.search-box input {
  width: 100%; padding: 10px 12px 10px 34px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
  font-size: 13.5px;
}
.search-box input:focus { outline: none; border-color: var(--accent); }
.search-box::before {
  content: "🔍"; position: absolute; left: 11px; top: 50%;
  transform: translateY(-50%); font-size: 13px; opacity: .6;
}

.nav-chapter { margin-bottom: 4px; }
.nav-chapter > button {
  width: 100%; text-align: left; background: none; border: none; color: var(--text);
  font-size: 14px; font-weight: 700; padding: 9px 8px; border-radius: 8px;
  cursor: pointer; display: flex; align-items: center; gap: 9px;
}
.nav-chapter > button:hover { background: var(--bg-elev); }
.nav-chapter > button .chev { margin-left: auto; font-size: 11px; color: var(--text-faint); transition: transform .2s; }
.nav-chapter.collapsed .chev { transform: rotate(-90deg); }
.nav-chapter.collapsed .nav-sections { display: none; }
.nav-sections { padding: 2px 0 6px 30px; }
.nav-sections a {
  display: block; color: var(--text-dim); text-decoration: none;
  font-size: 13px; padding: 6px 10px; border-radius: 7px; border-left: 2px solid transparent;
}
.nav-sections a:hover { color: var(--text); background: var(--bg-elev); }
.nav-sections a.active {
  color: var(--accent); background: var(--accent-soft);
  border-left-color: var(--accent); font-weight: 600;
}

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; padding: 36px 48px 80px; max-width: 920px; }
.page-head { margin-bottom: 28px; }
.page-head .crumb { font-size: 12.5px; color: var(--text-faint); margin-bottom: 8px; }
.page-head h2 { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }

.section { margin-bottom: 44px; scroll-margin-top: 70px; }
.section > h3 {
  font-size: 21px; font-weight: 750; margin-bottom: 16px;
  padding-bottom: 9px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.section > h3 .anchor { font-size: 14px; color: var(--text-faint); opacity: 0; text-decoration: none; }
.section > h3:hover .anchor { opacity: 1; }

/* ---------- Blocks ---------- */
.blk { margin: 14px 0; }
.blk-h { font-size: 16.5px; font-weight: 700; margin: 24px 0 10px; color: var(--text); }
.blk-p { color: var(--text); }
.blk-p b { color: var(--accent); font-weight: 650; }
[data-theme="light"] .blk-p b { color: var(--accent); }

ul.blk-list, ol.blk-list { padding-left: 24px; }
ul.blk-list li, ol.blk-list li { margin: 7px 0; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.blk-table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 460px; }
table.blk-table th, table.blk-table td {
  padding: 10px 13px; text-align: left; border-bottom: 1px solid var(--border);
  vertical-align: top;
}
table.blk-table th { background: var(--bg-elev); font-weight: 700; color: var(--text); white-space: nowrap; }
table.blk-table tr:last-child td { border-bottom: none; }
table.blk-table td:first-child { font-weight: 600; }

/* kv table */
table.blk-kv { width: 100%; border-collapse: collapse; font-size: 14px; }
table.blk-kv td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.blk-kv td:first-child { font-weight: 700; color: var(--accent); white-space: nowrap; width: 1%; padding-right: 20px; }
table.blk-kv tr:last-child td { border-bottom: none; }
.kv-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* note boxes */
.note {
  border-radius: var(--radius); padding: 14px 16px; margin: 16px 0;
  border-left: 4px solid var(--info); background: var(--info-bg);
}
.note .note-title { font-weight: 700; font-size: 14px; margin-bottom: 5px; display: flex; align-items: center; gap: 7px; }
.note .note-body { font-size: 14px; color: var(--text); }
.note.tip  { border-left-color: var(--tip);  background: var(--tip-bg); }
.note.warn { border-left-color: var(--warn); background: var(--warn-bg); }
.note.why  { border-left-color: var(--why);  background: var(--why-bg); }
.note.info { border-left-color: var(--info); background: var(--info-bg); }

/* checklist */
.checklist { list-style: none; padding: 0; }
.checklist li {
  position: relative; padding: 8px 8px 8px 34px; margin: 4px 0;
  background: var(--card); border: 1px solid var(--border); border-radius: 9px; font-size: 14px;
}
.checklist li::before {
  content: "✓"; position: absolute; left: 11px; top: 8px;
  color: var(--tip); font-weight: 800;
}

code {
  background: var(--code-bg); padding: 2px 6px; border-radius: 5px;
  font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px;
  border: 1px solid var(--border);
}

/* search results */
.search-empty { color: var(--text-dim); padding: 20px; text-align: center; }
mark { background: var(--warn); color: #000; padding: 0 2px; border-radius: 3px; }

/* photo grid (real component photos) */
.imgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px; margin: 18px 0; }
.imgrid figure { margin: 0; }
.imgrid img { width: 100%; height: 130px; object-fit: contain; background: #fff;
  border: 1px solid var(--border); border-radius: 10px; padding: 6px; }
.imgrid figcaption { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }
.imgrid .credit { color: var(--text-faint); font-size: 11px; }
.imgrid .credit a { color: var(--text-faint); }
@media print { .imgrid img { height: auto; max-height: 130px; } }

/* figures */
.blk-fig { margin: 20px 0; }
.fig-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; overflow-x: auto;
}
.fig-box svg { width: 100%; height: auto; display: block; min-width: 460px; }
.blk-fig figcaption {
  margin-top: 10px; font-size: 13px; color: var(--text-dim);
  text-align: center; line-height: 1.6;
}
.fig-label { fill: var(--text); font-size: 13px; font-weight: 600; }
.fig-sub { fill: var(--text-dim); font-size: 11.5px; }
.fig-line { stroke: var(--text-dim); }

/* ---- diagram animation system (used inside fig SVGs) ---- */
/* Motion only when the user hasn't requested reduced motion.        */
/* Each diagram must still read correctly when static (first frame). */
@media (prefers-reduced-motion: no-preference) {
  .kb-flow { stroke-dasharray: 7 7; animation: kbFlow 1.1s linear infinite; }
  @keyframes kbFlow { to { stroke-dashoffset: -14; } }
  .kb-flow-rev { stroke-dasharray: 7 7; animation: kbFlowR 1.1s linear infinite; }
  @keyframes kbFlowR { to { stroke-dashoffset: 14; } }
  .kb-flow-slow { stroke-dasharray: 5 9; animation: kbFlow 2.2s linear infinite; }
  .kb-pulse { animation: kbPulse 1.9s ease-in-out infinite; }
  @keyframes kbPulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .kb-grow { transform-box: fill-box; transform-origin: center;
    animation: kbGrow 2.2s ease-in-out infinite; }
  @keyframes kbGrow { 0%,100% { transform: scale(.55); opacity: .35; }
    50% { transform: scale(1.1); opacity: .9; } }
  .kb-blink { animation: kbBlink 2.4s steps(1) infinite; }
  @keyframes kbBlink { 0%,33% { opacity: 1; } 34%,100% { opacity: .18; } }
}
/* delay helpers for sequencing */
.kb-d1 { animation-delay: .25s; } .kb-d2 { animation-delay: .5s; }
.kb-d3 { animation-delay: .75s; } .kb-d4 { animation-delay: 1s; }
.kb-d5 { animation-delay: 1.25s; } .kb-d6 { animation-delay: 1.5s; }
.kb-d7 { animation-delay: 1.75s; }
@media print { .kb-flow,.kb-flow-rev,.kb-flow-slow,.kb-pulse,.kb-grow,.kb-blink { animation: none !important; } }

/* master auto-checklist */
.autocheck .ac-total { font-size: 13px; color: var(--text-dim); margin-bottom: 16px;
  padding: 8px 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 9px; }
.ac-grp { margin: 18px 0; }
.ac-grp-h { display: flex; align-items: center; font-size: 15px; font-weight: 700;
  margin-bottom: 8px; color: var(--text); }
.ac-grp-h .ac-cnt { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--text-dim);
  background: var(--bg-elev); border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; }
.ac-list li { padding-right: 26px; }
.ac-src { position: absolute; right: 9px; top: 8px; text-decoration: none; color: var(--text-faint);
  font-size: 12px; }
.ac-src:hover { color: var(--accent); }

/* chapter prev/next nav */
.chap-nav { display: flex; gap: 12px; margin-top: 44px; }
.chap-nav-spacer { flex: 1; }
.chap-nav-btn { flex: 1; display: flex; flex-direction: column; gap: 3px; text-decoration: none;
  border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
  background: var(--card); color: var(--text); }
.chap-nav-btn:hover { border-color: var(--accent); }
.chap-nav-btn.next { text-align: right; }
.chap-nav-btn .cn-dir { font-size: 11.5px; color: var(--text-faint); }
.chap-nav-btn .cn-ttl { font-size: 14px; font-weight: 600; }

/* anchor copy */
.section > h3 .anchor { cursor: pointer; }
.section > h3 .anchor.copied { color: var(--tip); opacity: 1; }

.footer { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);
  color: var(--text-faint); font-size: 12.5px; }

/* print / PDF */
@media print {
  .sidebar, .topbar, .backdrop, .chap-nav, .anchor, .ac-src { display: none !important; }
  .layout { display: block; }
  .main { max-width: none; padding: 0; }
  body { font-size: 11pt; color: #000; background: #fff; }
  .note, .checklist li, table.blk-table th, .fig-box, .tbl-wrap, .kv-wrap, .ch, .ac-total {
    background: #fff !important; color: #000 !important;
    border-color: #bbb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .blk-p b, .ac-grp-h, table.blk-kv td:first-child { color: #000 !important; }
  .note { border-left-width: 3px !important; }
  .print-tab { font-size: 22pt; margin-top: 30px; page-break-before: always; break-before: page; }
  .print-tab:first-of-type { page-break-before: avoid; break-before: avoid; }
  .print-chap { font-size: 18pt; margin-top: 22px; padding-bottom: 6px;
    border-bottom: 2px solid #000; page-break-after: avoid; break-after: avoid; }
  .section { page-break-inside: avoid; break-inside: avoid; margin-bottom: 18px; }
  .section > h3 { page-break-after: avoid; break-after: avoid; }
  .blk-fig, table { page-break-inside: avoid; break-inside: avoid; }
  a { color: #000 !important; text-decoration: none; }
}

.toggles { display: flex; gap: 8px; padding: 0 4px 14px; }
.toggles button {
  flex: 1; background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
  border-radius: 8px; padding: 7px; cursor: pointer; font-size: 12.5px;
}
.toggles button:hover { color: var(--text); border-color: var(--accent); }

/* backdrop for mobile drawer */
.backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }

/* ---------- Responsive ---------- */
@media (max-width: 860px) {
  .topbar { display: flex; }
  .sidebar {
    position: fixed; left: 0; top: 0; z-index: 60;
    transform: translateX(-100%); transition: transform .25s ease;
    box-shadow: var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
  .backdrop.show { display: block; }
  .main { padding: 24px 18px 70px; }
  .page-head h2 { font-size: 24px; }
  .section > h3 { font-size: 19px; }
  body { font-size: 15px; }
}
@media (min-width: 861px) { .topbar { display: none; } }

</style>

  <script>
/**
 * 무선모듈 HW 설계 지식 베이스 — 콘텐츠 데이터
 *
 * 구조(계층):
 *   chapter (대분류)
 *     └─ section (중분류)
 *          └─ blocks[] (실제 콘텐츠 단위)
 *
 * blocks 타입:
 *   { t:'p',     html }                      문단 (HTML 허용)
 *   { t:'h',     text }                      소제목
 *   { t:'list',  items:[], ordered:false }   목록
 *   { t:'table', head:[], rows:[[]] }        표
 *   { t:'note',  kind:'tip|warn|why|info', title, html }  강조 박스
 *   { t:'check', items:[] }                  체크리스트
 *   { t:'kv',    rows:[[k,v]] }              용어/정의 표
 *
 * 지식을 추가할 때: 해당 section.blocks 에 블록을 덧붙이거나,
 * 새 section / 새 chapter 를 추가하면 사이드바·검색에 자동 반영됩니다.
 */

window.KB_CONTENT = {
  meta: {
    title: "무선모듈 HW 설계 지식 베이스",
    subtitle: "WiFi · BT/BLE · Zigbee/Thread · NFC · Wi-Fi HaLow 하드웨어 개발 노하우",
    version: "0.1",
    updated: "2026-06-30"
  },

  tabs: [
   {
    id: "design", label: "HW 설계 과정", icon: "🛠️",
    chapters: [
    /* ───────────────────────── 0. 시작하기 ───────────────────────── */
    {
      id: "intro",
      icon: "🧭",
      title: "0. 시작하기",
      sections: [
        {
          id: "intro-overview",

            { t: "p", html: "같은 증폭기라도 <b>신호 크기에 따라 다른 물리로 동작</b>합니다. 수신(LNA)은 미약 신호를 다루는 <b>소신호(선형)의 세계</b>, 송신(PA)은 큰 출력을 짜내는 <b>대신호(비선형)의 세계</b>입니다. 이 구분을 모르면 데이터시트의 어떤 스펙이 어디에 적용되는지 헷갈리고, 측정도 잘못 설계하게 됩니다." },

            { t: "note", kind: "why", title: "원리 — 선형 근사가 깨지는 지점", html: "<b>소신호</b> = 동작점 주변에서 선형 근사가 성립하는 영역. 이득·S파라미터·NF는 모두 소신호 개념이라 <b>신호 크기와 무관하게 일정</b>합니다. <b>대신호</b> = 출력이 전원 전압·전류 한계에 접근해 선형 근사가 깨지는 영역 — 이득이 줄고(압축), 잘린 파형이 <b>고조파·혼변조(IMD)</b>를 만듭니다. 경계의 척도가 <b>P1dB</b>(이득이 1dB 줄어드는 출력점)이며, 그 너머가 <b>Psat</b>(포화). 참고로 <b>OIP3 ≈ P1dB + 9~10dB</b>의 경험칙이 있습니다." },

          blocks: [
            { t: "p", html: "앞 섹션에서 '리턴전류가 우회하면 큰 루프가 생겨 EMI를 방사한다'고 했습니다. 여기서는 <b>왜·어떻게 방사가 일어나는지</b>를 안테나 이론으로 설명합니다. 핵심은 세 가지: ①<b>전류 루프는 자기 쌍극자 안테나</b>다 ②<b>방사는 주파수의 4제곱</b>으로 커진다 ③진짜 주범은 <b>커먼모드(common-mode) 전류로의 변환</b>이다." },

            { t: "note", kind: "info", title: "비유로 먼저", html: "회전문(폐루프)을 빠르게 돌리면(고주파 전류) 주변에 바람(전자기파)이 일어납니다. 문이 클수록(루프 면적↑), 더 빨리 돌릴수록(주파수↑) 바람이 셉니다. 신호선과 리턴이 딱 붙어 있으면 '문틈'이 거의 없어 바람이 안 일지만, 리턴이 멀리 우회하면 '거대한 회전문'이 되어 사방으로 바람을 뿜습니다." },

            { t: "h", text: "① 전류 루프 = 자기 쌍극자(magnetic dipole) 안테나" },
            { t: "p", html: "시변(時變) 전류가 흐르는 닫힌 루프는 그 자체가 <b>소형 루프 안테나</b>로 동작합니다. 안테나 이론에서 작은 루프가 만드는 원거리(far-field) 방사 전계는 다음에 비례합니다:" },
            { t: "note", kind: "why", title: "방사 공식 (작은 루프)", html: "<b>E<sub>far</sub> ∝ ( I × A × f² ) / r</b>, &nbsp; 방사 전력 <b>P<sub>rad</sub> ∝ I² × A² × f⁴</b><br>여기서 <b>I</b>=루프 전류, <b>A</b>=루프가 감싸는 면적, <b>f</b>=주파수, <b>r</b>=거리.<br>→ 방사는 <b>면적의 제곱</b>, <b>주파수의 4제곱</b>에 비례합니다. 신호선 바로 아래로 리턴이 흐르면 A≈0이라 방사가 거의 없지만, 우회로 A가 커지면 제곱으로 폭증합니다." },

            { t: "h", text: "② 주파수 4제곱 법칙 — 왜 RF에서 치명적인가" },
            { t: "p", html: "P<sub>rad</sub> ∝ f⁴ 때문에 같은 루프라도 주파수가 오르면 방사가 폭발적으로 커집니다. 2.4GHz·5GHz 같은 RF 대역에서 작은 슬릿 우회조차 위험한 이유입니다." },
            { t: "table",
              head: ["조건 변화", "방사 전력 변화", "의미"],
              rows: [
                ["루프 면적 2배", "× 4", "A² 비례 — 우회 거리 조금만 늘어도 급증"],
                ["주파수 2배 (2.4G→~5G)", "× 16", "f⁴ 비례 — 고주파일수록 치명적"],
                ["면적 2배 + 주파수 2배", "× 64", "두 효과가 곱해짐"],
                ["저속 디지털(예: 수 MHz)", "거의 무시", "같은 루프라도 f⁴이 작아 방사 미미"],
              ]
            },
            { t: "note", kind: "tip", title: "역설적 통찰", html: "저주파에서는 GND 슬릿이 있어도 EMI가 잘 안 보입니다(f⁴이 작아서). 그래서 '2.4G에선 괜찮던 레이아웃'이 5/6G로 가면 갑자기 EMI 불합격이 납니다. <b>주파수가 오르면 리턴 경로 규율이 비선형적으로 엄격해진다</b>는 점을 기억하세요." },

            { t: "h", text: "③ 슬릿 양단 전압 — 슬롯 안테나로 동작" },
            { t: "p", html: "리턴전류가 슬릿을 만나 우회할 때, 우회 경로의 <b>부분 인덕턴스(partial inductance)</b>가 늘어납니다. 고주파 전류는 변화율(di/dt)이 크므로 인덕턴스 양단에 전압이 생깁니다:" },
            { t: "note", kind: "why", title: "V = L · (di/dt)", html: "우회로 늘어난 인덕턴스 <b>L</b>과 RF의 큰 <b>di/dt</b>가 곱해져 <b>슬릿 양단에 RF 전압</b>이 걸립니다. 전압이 걸린 틈(슬릿)은 곧 <b>슬롯 안테나(slot antenna)</b>가 되어 효율적으로 방사합니다. 즉 우회는 ①큰 루프(자기 다이폴) ②전압 걸린 슬롯(슬롯 안테나) <b>두 가지 방사원</b>을 동시에 만듭니다." },

            { t: "h", text: "④ 진짜 주범 — 커먼모드(common-mode) 전류 변환" },
            { t: "p", html: "정상 상태에서 신호전류(→)와 리턴전류(←)는 크기가 같고 방향이 반대라, 멀리서 보면 자기장이 상쇄됩니다(차동/differential 모드 → 방사 거의 0). 그런데 리턴이 우회해 <b>신호와 리턴의 전류 '무게중심'이 어긋나면</b> 상쇄가 깨집니다." },
            { t: "fig",
              caption: "차동모드(좌): 신호·리턴이 겹쳐 자기장 상쇄 → 방사 거의 없음. 우회 시(우): 상쇄가 깨진 불평형분이 커먼모드 전류로 전환되어 케이블·금속 구조물을 타고 흘러 방사한다. 실제 제품 EMI 불합격의 대부분이 이 커먼모드 방사다.",
              svg: '<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="차동모드와 커먼모드 전류">'

                + '<text x="155" y="22" text-anchor="middle" class="fig-label">차동모드 (정상)</text>'

                + '<text x="60" y="50" class="fig-sub" fill="#4aa3ff">신호 I →</text>'
                + '<line class="kb-flow" x1="250" y1="80" x2="60" y2="80" stroke="#2ea043" stroke-width="3" marker-end="url(#cmG)"/>'

                + '<path class="kb-flow" d="M470,140 L560,140" marker-end="url(#cmR)"/>'

                + '<text x="465" y="185" text-anchor="middle" class="fig-sub" fill="#e5534b">커먼모드 전류 → 케이블·구조물 타고 방사</text>'
                + '</svg>'
            },
            { t: "note", kind: "warn", title: "커먼모드가 무서운 이유", html: "차동모드 방사는 루프가 작으면 자연히 작지만, <b>커먼모드 전류는 케이블·하네스·금속 샤시 전체를 안테나로 만들어</b> 수십 cm~m 길이로 방사합니다. 작은 슬릿이 만든 작은 불평형도 긴 케이블을 만나면 강한 방사가 됩니다. 가전처럼 모터·하네스·금속 구조가 많은 환경에서 특히 위험합니다." },

            { t: "h", text: "⑤ 정리 — 우회 한 번이 만드는 3중 방사" },
            { t: "kv", rows: [
              ["자기 쌍극자 방사", "커진 루프 면적 A → P ∝ A²·f⁴ 로 직접 방사"],
              ["슬롯 안테나 방사", "우회 인덕턴스 × di/dt → 슬릿 양단 전압 → 틈이 방사"],
              ["커먼모드 방사", "신호·리턴 불평형 → CM 전류 → 케이블·구조물이 대형 안테나로"],
            ]},
            { t: "note", kind: "tip", title: "설계 대응 (원리에서 도출)", html: "①<b>루프 면적을 0에 수렴</b>시켜라 — RF 라인 바로 아래 연속 GND, 리턴이 따라올 길 보장(자기 다이폴 억제). ②<b>슬릿을 만들지 마라</b> — 불가피하면 RF 라인이 슬릿을 가로지르지 않게(슬롯 안테나 억제). ③<b>커먼모드 차단</b> — 외부 케이블에 커먼모드 초크/페라이트, RF 블록 쉴드캔, 안정된 GND 기준. ④고주파일수록(f⁴) 위 규율을 더 엄격히 적용." },

            { t: "note", kind: "info", title: "더 알아보기", html: "이 원리는 7장 <a href='#ver-emc'>EMC·공존</a>의 방사 방출 시험과 직결됩니다. 또한 5장 <a href='#pcb-ground'>그라운드·리턴 패스</a>의 그림 1·2가 이 절의 출발점입니다." },
          ]
        },
        {
          id: "pcb-stitching",
          title: "스티칭 비아(Stitching/Return Via) — 리턴경로를 잇는 못",
          blocks: [
            { t: "p", html: "<b>스티칭 비아</b>는 서로 다른 층의 GND(또는 같은 GND의 떨어진 영역)를 비아로 '꿰매어(stitch)' 하나의 전위로 묶고, <b>리턴전류가 따라갈 길을 물리적으로 만들어 주는</b> 비아입니다. 리턴 패스 규율을 실제 보드에 구현하는 핵심 도구입니다." },
            { t: "note", kind: "info", title: "비유로 먼저", html: "여러 층의 GND는 '여러 층짜리 주차장 바닥'입니다. 차(리턴전류)가 위층에서 아래층으로 내려가려면 <b>경사로(비아)</b>가 있어야 합니다. 신호가 층을 바꾸는 지점 옆에 경사로가 없으면, 차는 멀리 있는 다른 경사로까지 돌아가야 하고(=큰 루프=EMI), 가까이 있으면 바로 따라 내려갑니다." },

            { t: "h", text: "어디에·왜 쓰는가 (4가지 용도)" },
            { t: "kv", rows: [
              ["① 리턴 비아 (Return Via)", "신호가 비아로 층을 바꿀 때, <b>그 신호 비아 바로 옆</b>에 GND 비아를 둬서 리턴전류가 같은 지점에서 층을 따라 내려가게 함. 없으면 리턴이 우회 → 임피던스 불연속·방사"],
              ["② 플레인 본딩", "여러 GND 플레인을 곳곳에서 묶어 <b>같은 전위</b> 유지. 안 묶으면 플레인 사이가 공진 캐비티가 되어 노이즈가 갇히고 방사"],
              ["③ CPWG 측면 GND 연결", "표층 코플래너 GND를 아래 메인 GND 플레인에 비아로 연결해야 진짜 50Ω·차폐 효과. 비아 없으면 표층 GND가 '떠서' 무의미"],
              ["④ 비아 펜스(Via Fence)", "RF 라인·보드 가장자리·블록 경계를 따라 비아를 줄지어 박아 <b>전자기 울타리</b>를 만듦. 모서리 방사 억제·블록 간 격리"],
            ]},

            { t: "h", text: "간격 규칙 — λ/10~λ/20 (가장 중요)" },
            { t: "p", html: "비아 간격이 너무 넓으면 그 틈으로 전자기파가 새어 나갑니다(슬롯처럼 동작). 경험칙은 <b>관심 최고 주파수에서 유전체 내 파장의 1/10(보수적으로 1/20) 이하 간격</b>입니다. 유전체 내 파장은 <b>λ<sub>g</sub> = c / (f·√ε<sub>r</sub>)</b> 로 줄어듭니다(FR-4 ε<sub>r</sub>≈4.3)." },
            { t: "table",
              head: ["주파수", "유전체 내 파장 λg (FR-4)", "λ/10 (권장 상한)", "λ/20 (보수적)"],
              rows: [

            },
            { t: "note", kind: "tip", title: "고조파까지 고려", html: "방사 억제가 목적이라면 기본 주파수가 아니라 <b>억제하려는 최고 고조파</b> 기준으로 간격을 정하세요. 예: 5GHz의 2·3차 고조파(10/15GHz)를 막으려면 그 주파수의 λ/10(약 1mm 안팎)으로 더 촘촘히. 실무에선 RF 라인 주변·안테나 급전부는 <b>약 1~2mm 피치</b>로 박는 경우가 많습니다." },

            { t: "h", text: "리턴 비아 — 신호 비아 옆에 짝으로" },
            { t: "fig",
              caption: "신호가 비아로 층을 바꿀 때(파랑), 바로 옆에 리턴 비아(초록)가 있으면 리턴전류가 같은 지점에서 층을 따라 내려가 루프가 작다. 리턴 비아가 없으면(우) 리턴은 가장 가까운 먼 GND 연결까지 우회해 큰 루프·방사를 만든다.",

/* ============ 무선모듈 HW 지식 베이스 — 렌더러/라우터/검색 ============ */
(function () {
  "use strict";
  const KB = window.KB_CONTENT;
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, html) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  };

  /* ---- tabs ---- */
  const TABS = KB.tabs || [{ id: "main", label: "문서", icon: "📘", chapters: KB.chapters || [] }];
  let activeTab = TABS[0].id;
  function tabById(id) { return TABS.find(t => t.id === id) || TABS[0]; }
  function chaptersOf(tabId) { return tabById(tabId).chapters; }
  function findChapter(chapId) {
    for (const t of TABS) { const c = t.chapters.find(c => c.id === chapId); if (c) return { tab: t, ch: c }; }
    return null;
  }
  function findSectionTab(secId) {
    for (const t of TABS) if (t.chapters.some(c => c.sections.some(s => s.id === secId))) return t;
    return null;
  }

  /* ---- index for search (all tabs) ---- */
  const index = []; // {tabId, tabLabel, chapTitle, secId, secTitle, text}
  TABS.forEach(t => t.chapters.forEach(ch => ch.sections.forEach(sec => {
    const text = blocksToText(sec.blocks);
    index.push({ tabId: t.id, tabLabel: t.label, chapTitle: ch.title, secId: sec.id, secTitle: sec.title, text });
  })));

  function blocksToText(blocks) {
    return (blocks || []).map(b => {
      switch (b.t) {
        case "p": case "h": return strip(b.html || b.text || "");
        case "list": case "check": return (b.items || []).map(strip).join(" ");
        case "note": return strip((b.title || "") + " " + (b.html || ""));
        case "fig": return strip(b.caption || "");
        case "imgrid": return (b.items || []).map(i => strip(i.caption || "") + " " + (i.alt || "")).join(" ");
        case "table": return [(b.head || []).join(" "), ...(b.rows || []).map(r => r.join(" "))].join(" ");
        case "kv": return (b.rows || []).map(r => r.join(" ")).join(" ");
        default: return "";
      }
    }).join(" ");
  }
  function strip(h) { const d = el("div", null, h); return d.textContent || ""; }
  function esc(s) { return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

  /* ---- block renderer ---- */
  function renderBlock(b) {
    switch (b.t) {
      case "p": return el("p", "blk blk-p", b.html);
      case "h": return el("h4", "blk-h", esc(b.text));
      case "list": {
        const ul = el(b.ordered ? "ol" : "ul", "blk blk-list");
        (b.items || []).forEach(i => ul.appendChild(el("li", null, i)));
        return ul;
      }
      case "check": {
        const ul = el("ul", "blk checklist");
        (b.items || []).forEach(i => ul.appendChild(el("li", null, i)));
        return ul;
      }
      case "table": {
        const wrap = el("div", "blk tbl-wrap");
        const t = el("table", "blk-table");
        if (b.head) {
          const thead = el("thead"); const tr = el("tr");
          b.head.forEach(h => tr.appendChild(el("th", null, esc(h))));
          thead.appendChild(tr); t.appendChild(thead);
        }
        const tb = el("tbody");
        (b.rows || []).forEach(r => {
          const tr = el("tr");
          r.forEach(c => tr.appendChild(el("td", null, c)));
          tb.appendChild(tr);
        });
        t.appendChild(tb); wrap.appendChild(t); return wrap;
      }
      case "kv": {
        const wrap = el("div", "blk kv-wrap");
        const t = el("table", "blk-kv"); const tb = el("tbody");
        (b.rows || []).forEach(([k, v]) => {
          const tr = el("tr");
          tr.appendChild(el("td", null, esc(k)));
          tr.appendChild(el("td", null, v));
          tb.appendChild(tr);
        });
        t.appendChild(tb); wrap.appendChild(t); return wrap;
      }
      case "note": {
        const icons = { tip: "💡", warn: "⚠️", why: "❓왜?", info: "ℹ️" };
        const kind = b.kind || "info";
        const n = el("div", "note " + kind);
        const label = (icons[kind] || "ℹ️") + " " + (b.title || "");
        n.appendChild(el("div", "note-title", esc(label)));
        n.appendChild(el("div", "note-body", b.html));
        return n;
      }
      case "fig": {
        const f = el("figure", "blk blk-fig");
        const box = el("div", "fig-box", b.svg);
        f.appendChild(box);
        if (b.caption) f.appendChild(el("figcaption", null, b.caption));
        return f;
      }
      case "imgrid": {
        const wrap = el("div", "blk imgrid");
        (b.items || []).forEach(it => {
          const f = el("figure");
          const img = el("img");
          img.src = it.src; img.alt = it.alt || ""; img.loading = "lazy";
          f.appendChild(img);
          const cap = el("figcaption",
            null, esc(it.caption || "") + (it.credit ? '<br><span class="credit">' + it.credit + "</span>" : ""));
          f.appendChild(cap);
          wrap.appendChild(f);
        });
        return wrap;
      }
      case "autocheck": return renderAutoCheck();
      default: return el("div");
    }
  }

  /* ---- auto-aggregated master checklist (from all `check` blocks) ---- */
  function renderAutoCheck() {
    const wrap = el("div", "blk autocheck");
    let total = 0;
    chaptersOf("design").forEach(ch => {
      const items = [];
      ch.sections.forEach(sec => {
        (sec.blocks || []).forEach(b => {
          if (b.t === "check") (b.items || []).forEach(i => items.push({ i, secId: sec.id, secTitle: sec.title }));
        });
      });
      if (!items.length) return;
      total += items.length;
      const grp = el("div", "ac-grp");
      grp.appendChild(el("div", "ac-grp-h",
        `<span>${ch.icon || ""} ${esc(ch.title)}</span><span class="ac-cnt">${items.length}</span>`));
      const ul = el("ul", "checklist ac-list");
      items.forEach(({ i, secId, secTitle }) => {
        const li = el("li", null, i + ` <a class="ac-src" href="#${secId}" title="${esc(secTitle)}">↗</a>`);
        ul.appendChild(li);
      });
      grp.appendChild(ul);
      wrap.appendChild(grp);
    });
    const cap = el("div", "ac-total", `총 ${total}개 점검 항목 · 단계별로 빠짐없이 확인하세요`);
    wrap.insertBefore(cap, wrap.firstChild);
    return wrap;
  }

  /* ---- tab bar ---- */
  function buildTabBar() {
    const bar = $("#tabbar");
    if (!bar) return;
    bar.innerHTML = "";
    TABS.forEach(t => {
      const b = el("button", "tab-btn" + (t.id === activeTab ? " active" : ""),
        `<span>${t.icon || ""}</span><span>${esc(t.label)}</span>`);
      b.dataset.tab = t.id;
      b.addEventListener("click", () => {
        if (t.id === activeTab) return;
        activeTab = t.id;
        buildTabBar();
        buildSidebar();
        const first = chaptersOf(t.id)[0];
        if (first) location.hash = first.id;
      });
      bar.appendChild(b);
    });
  }

  /* ---- sidebar ---- */
  function buildSidebar() {
    const nav = $("#nav");
    nav.innerHTML = "";
    chaptersOf(activeTab).forEach(ch => {
      const wrap = el("div", "nav-chapter");
      wrap.dataset.chap = ch.id;
      const btn = el("button", null,
        `<span>${ch.icon || ""}</span><span>${esc(ch.title)}</span><span class="chev">▾</span>`);
      btn.addEventListener("click", () => wrap.classList.toggle("collapsed"));
      wrap.appendChild(btn);
      const secWrap = el("div", "nav-sections");
      ch.sections.forEach(sec => {
        const a = el("a", null, esc(sec.title));
        a.href = "#" + sec.id;
        a.dataset.sec = sec.id;
        secWrap.appendChild(a);
      });
      wrap.appendChild(secWrap);
      nav.appendChild(wrap);
    });
  }

  /* ---- render a chapter page ---- */
  function renderChapter(chapId, focusSecId) {
    const found = findChapter(chapId) || { tab: TABS[0], ch: TABS[0].chapters[0] };
    const ch = found.ch;
    if (found.tab.id !== activeTab) { activeTab = found.tab.id; buildTabBar(); buildSidebar(); }
    const main = $("#main");
    main.innerHTML = "";
    const head = el("div", "page-head");
    head.appendChild(el("div", "crumb", esc(KB.meta.title)));
    head.appendChild(el("h2", null, (ch.icon ? ch.icon + " " : "") + esc(ch.title)));
    main.appendChild(head);

    ch.sections.forEach(sec => {
      const s = el("section", "section");
      s.id = sec.id;
      const h3 = el("h3", null, esc(sec.title) +
        ` <a class="anchor" href="#${sec.id}" title="이 섹션 링크 복사">#</a>`);
      h3.querySelector(".anchor").addEventListener("click", e => {
        e.preventDefault();
        copySectionLink(sec.id, e.currentTarget);
      });
      s.appendChild(h3);
      (sec.blocks || []).forEach(b => s.appendChild(renderBlock(b)));
      main.appendChild(s);
    });

    main.appendChild(buildChapterNav(chapId));

    const f = el("div", "footer",
      `${esc(KB.meta.title)} · v${KB.meta.version} · 최종 업데이트 ${KB.meta.updated}<br>` +
      `콘텐츠는 <code>assets/data/content.js</code>에서 계층적으로 관리·확장됩니다.`);
    main.appendChild(f);

    setActiveNav(chapId, focusSecId);
    if (focusSecId) {
      const t = document.getElementById(focusSecId);
      if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
      main.scrollTop = 0; window.scrollTo(0, 0);
    }
    closeDrawer();
  }

  /* ---- chapter prev/next navigation ---- */
  function buildChapterNav(chapId) {
    const chs = chaptersOf(activeTab);
    const idx = chs.findIndex(c => c.id === chapId);
    const prev = chs[idx - 1];
    const next = chs[idx + 1];
    const nav = el("nav", "chap-nav");
    const mk = (ch, dir) => {
      if (!ch) { nav.appendChild(el("span", "chap-nav-spacer")); return; }
      const a = el("a", "chap-nav-btn " + dir,
        `<span class="cn-dir">${dir === "prev" ? "← 이전" : "다음 →"}</span>` +
        `<span class="cn-ttl">${ch.icon || ""} ${esc(ch.title)}</span>`);
      a.href = "#" + ch.id;
      nav.appendChild(a);
    };
    mk(prev, "prev"); mk(next, "next");
    return nav;
  }

  /* ---- copy section deep-link ---- */
  function copySectionLink(secId, btn) {
    const url = location.origin + location.pathname + "#" + secId;
    const done = () => {
      const old = btn.textContent; btn.textContent = "✓";
      btn.classList.add("copied");
      setTimeout(() => { btn.textContent = old; btn.classList.remove("copied"); }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => { location.hash = secId; });
    } else { location.hash = secId; }
  }

  function setActiveNav(chapId, secId) {
    document.querySelectorAll(".nav-chapter").forEach(w => {
      const on = w.dataset.chap === chapId;
      w.classList.toggle("collapsed", !on);
    });
    document.querySelectorAll(".nav-sections a").forEach(a => {
      a.classList.toggle("active", a.dataset.sec === (secId || ""));
    });
  }

  /* ---- routing via hash (section id) ---- */
  function findChapterOfSection(secId) {
    for (const t of TABS)
      for (const ch of t.chapters)
        if (ch.sections.some(s => s.id === secId)) return ch.id;
    return null;
  }
  function route() {
    const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!hash) { renderChapter(TABS[0].chapters[0].id); return; }
    const chapId = findChapterOfSection(hash);
    if (chapId) renderChapter(chapId, hash);
    else if (findChapter(hash)) renderChapter(hash);
    else renderChapter(TABS[0].chapters[0].id);
  }

  /* ---- scroll-spy: highlight section in view ---- */
  function setupScrollSpy() {
    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          const id = e.target.id;
          document.querySelectorAll(".nav-sections a").forEach(a =>
            a.classList.toggle("active", a.dataset.sec === id));
        }
      });
    }, { rootMargin: "-10% 0px -75% 0px", threshold: 0 });
    document.querySelectorAll(".section").forEach(s => obs.observe(s));
    window.__kbObserver = obs;
  }

  /* ---- search ---- */
  function runSearch(q) {
    q = q.trim().toLowerCase();
    const main = $("#main");
    if (!q) { route(); return; }
    const terms = q.split(/\s+/).filter(Boolean);
    const hits = index.map(item => {
      const hay = (item.secTitle + " " + item.chapTitle + " " + item.text).toLowerCase();
      let score = 0;
      terms.forEach(t => {
        if (item.secTitle.toLowerCase().includes(t)) score += 5;
        const m = hay.split(t).length - 1; score += m;
      });
      return { item, score };
    }).filter(h => h.score > 0).sort((a, b) => b.score - a.score).slice(0, 30);

    main.innerHTML = "";
    const head = el("div", "page-head");
    head.appendChild(el("div", "crumb", "검색"));
    head.appendChild(el("h2", null, `🔍 "${esc(q)}" — ${hits.length}건`));
    main.appendChild(head);

    if (!hits.length) {
      main.appendChild(el("div", "search-empty", "일치하는 내용이 없습니다."));
      return;
    }
    hits.forEach(({ item }) => {
      const s = el("section", "section");
      const a = el("a", null, "");
      a.href = "#" + item.secId;
      a.style.textDecoration = "none";
      const h3 = el("h3", null, highlight(item.secTitle, terms));
      h3.style.cursor = "pointer";
      h3.addEventListener("click", () => { location.hash = item.secId; });
      s.appendChild(el("div", "crumb", esc(item.tabLabel + " · " + item.chapTitle)));
      s.appendChild(h3);
      s.appendChild(el("p", "blk-p", snippet(item.text, terms)));
      main.appendChild(s);
    });
  }
  function highlight(text, terms) {
    let t = esc(text);
    terms.forEach(term => {
      if (!term) return;
      const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      t = t.replace(re, "<mark>$1</mark>");
    });
    return t;
  }
  function snippet(text, terms) {
    const lower = text.toLowerCase();
    let pos = -1;
    for (const t of terms) { const p = lower.indexOf(t); if (p >= 0) { pos = p; break; } }
    if (pos < 0) pos = 0;
    const start = Math.max(0, pos - 60);
    const seg = (start > 0 ? "…" : "") + text.slice(start, start + 200) + "…";
    return highlight(seg, terms);
  }

  /* ---- theme ---- */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("kb-theme", t); } catch (e) {}
    const btn = $("#themeBtn");
    if (btn) btn.textContent = t === "light" ? "🌙 다크" : "☀️ 라이트";
  }

  /* ---- drawer (mobile) ---- */
  function openDrawer() { $("#sidebar").classList.add("open"); $("#backdrop").classList.add("show"); }
  function closeDrawer() { $("#sidebar").classList.remove("open"); $("#backdrop").classList.remove("show"); }

  /* ---- print: render whole site, then trigger print dialog ---- */
  function printAll() {
    const main = $("#main");
    main.innerHTML = "";
    const head = el("div", "page-head");
    head.appendChild(el("h2", null, esc(KB.meta.title)));
    head.appendChild(el("div", "crumb", esc(KB.meta.subtitle) +
      ` · v${KB.meta.version} · ${KB.meta.updated}`));
    main.appendChild(head);
    TABS.forEach(t => {
      main.appendChild(el("h1", "print-tab", (t.icon ? t.icon + " " : "") + esc(t.label)));
      t.chapters.forEach(ch => {
        main.appendChild(el("h2", "print-chap", (ch.icon ? ch.icon + " " : "") + esc(ch.title)));
        ch.sections.forEach(sec => {
          const s = el("section", "section");
          s.id = sec.id;
          s.appendChild(el("h3", null, esc(sec.title)));
          (sec.blocks || []).forEach(b => s.appendChild(renderBlock(b)));
          main.appendChild(s);
        });
      });
    });
    window.scrollTo(0, 0);
    document.body.classList.add("printing");
    setTimeout(() => {
      window.print();
      document.body.classList.remove("printing");
    }, 300);
  }

  /* ---- init ---- */
  function init() {
    $("#brandTitle").textContent = KB.meta.title;
    $("#brandSub").textContent = KB.meta.subtitle;
    $("#brandVer").textContent = "v" + KB.meta.version + " · " + KB.meta.updated;
    $("#topTitle").textContent = KB.meta.title;
    document.title = KB.meta.title;

    buildTabBar();
    buildSidebar();

    let theme = "dark";
    try { theme = localStorage.getItem("kb-theme") || "dark"; } catch (e) {}
    applyTheme(theme);

    const search = $("#search");
    let timer;
    search.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => runSearch(search.value), 150);
    });
    search.addEventListener("keydown", e => {
      if (e.key === "Escape") { search.value = ""; route(); }
    });

    $("#themeBtn").addEventListener("click", () =>
      applyTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light"));
    $("#expandBtn").addEventListener("click", () => {
      const collapse = !document.querySelector(".nav-chapter.collapsed");
      document.querySelectorAll(".nav-chapter").forEach(w => w.classList.toggle("collapsed", collapse));
    });
    $("#menuBtn").addEventListener("click", openDrawer);
    $("#backdrop").addEventListener("click", closeDrawer);
    const pb = $("#printBtn"); if (pb) pb.addEventListener("click", printAll);

    window.addEventListener("hashchange", () => {
      if (search.value) search.value = "";
      route();
      setTimeout(setupScrollSpy, 50);
    });

    route();
    setTimeout(setupScrollSpy, 50);
  }

  if (document.readyState === "loading")
    document.addEventListener("DOMContentLoaded", init);
  else init();
})();

  </script>
</body>
</html>
